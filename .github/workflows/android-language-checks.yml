name: Android language checks
on:
  push:
    branches: [feat/android-languages]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Tests, lint and debug APK
        run: ./gradlew test lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-language-checks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
            app/build/test-results/**
  locale-switch:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [26, 33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-read-only: false
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locale-switch-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
